name: Backend CI

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

jobs:
  build-and-test:
    name: Build and Test RESTful API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Show Java version
        run: java -version

      - name: Build and run tests
        run: mvn -B clean verify

      - name: Show generated artifact
        if: success()
        run: |
          echo "Backend build completed successfully."
          ls -la target
